[package]
name = "wrkfetch"
version = "0.1.6"
edition = "2024"
authors = ["wxwreak"]
description = "A lightweight, custom system information fetch tool written in Rust, featuring modular ASCII art with date-based Easter eggs and fast package counting."
license = "MIT"
repository = "https://github.com/wxwreak/wrkfetch"
readme = "README.md"
exlude = [
    ".github/",
    ".gitignore"
]
keywords = ["neofetch", "wrkfetch", "system-info", "cli", "ascii-art"]
categories = ["command-line-utilities", "os"]

[dependencies]
colored = "3.1.1"
sysinfo = "0.39.6"
pollster = "0.4"
clap = { version = "4.5", features = ['derive'] }
chrono = "0.4.45"
